# ============================================================
# APPLICATION
# ============================================================
spring.application.name=visite

# ============================================================
# H2 DATABASE
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/rms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# ============================================================
# H2 CONSOLE
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ============================================================
# DATA INITIALIZATION
# ============================================================
spring.sql.init.mode=never

# ============================================================
# CORS CONFIGURATION
# ============================================================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ============================================================
# EMAIL CONFIGURATION - ENVOI (SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hamzabelkhou19@gmail.com
spring.mail.password=idklbjwhogxvsmfo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# ?? IMPORTANT : ACTIVER LES EMAILS (true pour envoyer)
# ============================================================
spring.mail.enabled=true

# ============================================================
# ?? IMPORTANT : DÉSACTIVER LA LECTURE AUTOMATIQUE DES EMAILS
# ============================================================
spring.mail.inbox.enabled=false

# ============================================================
# ?? IMPORTANT : DÉSACTIVER TOUS LES SCHEDULERS
# ============================================================
spring.task.scheduling.enabled=false

# ============================================================
# PLANNING CONFIGURATION
# ============================================================
planning.delai-reponse-jours=7
planning.nb-relances-max=2
planning.proposition-decalage-jours=7
planning.annee-courante=2026
planning.max-visites-par-client=20
planning.email-delai-minutes=5

# ============================================================
# LOGGING
# ============================================================
logging.level.com.example=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.scheduling=DEBUG

spring.profiles.active=default

# ============================================================
# SPRING BOOT MULTIPART (UPLOAD) CONFIGURATION
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=uploads/pieces

# App upload directory
app.upload.dir=uploads/pieces

# ============================================================
# EMAIL CONFIGURATION - DEBUG
# ============================================================
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2